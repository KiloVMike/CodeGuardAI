[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codeguard-ai"
version = "0.2.0"
description = "Local-first CodeBERT vulnerability detection for C functions"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "datasets==4.8.5",
  "gradio==6.17.3",
  "hf-xet==1.6.0",
  "matplotlib==3.11.2",
  "numpy==2.5.3",
  "pandas==2.3.3",
  "scikit-learn==1.9.1",
  "seaborn==0.13.2",
  "torch==2.14.0",
  "tqdm==4.70.1",
  "transformers==4.57.6",
]

[project.optional-dependencies]
lora = ["peft==0.17.1"]
notebook = ["jupyterlab>=4.3,<5", "nbformat>=5.10,<6"]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.9",
]

[project.scripts]
codeguard = "codeguard_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
per-file-ignores = { "*.ipynb" = ["I001"] }
